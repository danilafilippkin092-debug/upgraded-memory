name: DBY-W09 source audit (no flashing)
on:
  push:
    branches: [dby-w09-port-wip]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit board source candidates
        run: |
          python3 tools/audit.py
          python3 -m unittest discover -s tests -v
